# Entorno de datos para el modelo de RL de Macrobus.
# La BD es 100% reconstruible desde ./data/*.sql -> no hay estado que respaldar.
# Credenciales de desarrollo local; los puertos solo se publican en 127.0.0.1.

services:
  mysql:
    image: mysql:8.0.36
    container_name: macro-mysql
    restart: unless-stopped
    # El tuning va como flags y no como conf.d: un bind mount desde Windows queda
    # world-writable y mysqld descarta esos archivos de configuracion.
    # Perfil de carga masiva + lectura analitica: la BD es reconstruible desde los
    # dumps, asi que privilegiamos throughput sobre durabilidad.
    command:
      - --innodb-buffer-pool-size=4G
      - --innodb-redo-log-capacity=2G
      - --innodb-flush-log-at-trx-commit=0
      - --innodb-flush-method=O_DIRECT
      - --innodb-doublewrite=0
      - --innodb-autoinc-lock-mode=2
      - --innodb-io-capacity=2000
      - --innodb-io-capacity-max=4000
      - --max-allowed-packet=1G
      - --net-buffer-length=1M
      - --local-infile=1
      - --tmp-table-size=256M
      - --max-heap-table-size=256M
      # El dump viene con TIME_ZONE='+00:00': todo se queda en UTC y se convierte
      # en la capa de features, no en la BD.
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --secure-file-priv=/var/lib/mysql-files
    environment:
      MYSQL_ROOT_PASSWORD: macro
      MYSQL_DATABASE: integration
      MYSQL_USER: macro
      MYSQL_PASSWORD: macro
      TZ: UTC
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/initdb:/docker-entrypoint-initdb.d:ro
      # Los dumps se montan de solo lectura; NO se copian al volumen.
      - ./data:/dump:ro
      # Salida de exports (Parquet/CSV) hacia el host.
      - ./data/export:/var/lib/mysql-files
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pmacro"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    shm_size: 1gb

  adminer:
    image: adminer:4.8.1-standalone
    container_name: macro-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: dracula
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
    name: macro_mysql_data
